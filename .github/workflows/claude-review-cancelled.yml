name: Claude Review Failed-Run Receipt

on:
  workflow_run:
    workflows: [Claude Code Review]
    types: [completed]

jobs:
  fail-closed-review-run:
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      startsWith(github.event.workflow_run.display_title, 'Claude review PR #') &&
      contains(fromJSON('["workflow_dispatch","pull_request","issue_comment","pull_request_review_comment"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Publish failed-run receipt
        shell: bash
        env:
          DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          DETAILS_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_EVENT: ${{ github.event.workflow_run.event }}
          FAILED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
          TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const apiUrl = process.env.GITHUB_API_URL || "https://api.github.com";
          const repository = process.env.GITHUB_REPOSITORY || "";
          const token = process.env.GITHUB_TOKEN || "";
          const displayTitle = process.env.DISPLAY_TITLE || "";
          const detailsUrl = process.env.DETAILS_URL || "";
          const failedRunId = process.env.FAILED_RUN_ID || "";
          const failedEvent = process.env.FAILED_EVENT || "";
          const failedConclusion = process.env.FAILED_CONCLUSION || "failure";
          const runActor = process.env.RUN_ACTOR || "";
          const triggeringActor = process.env.TRIGGERING_ACTOR || "";
          const allowedEvents = new Set(["workflow_dispatch", "pull_request", "issue_comment", "pull_request_review_comment"]);
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            "Content-Type": "application/json",
          };
          const requestJson = async (url) => {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`${url} returned HTTP ${response.status}`);
            return { data: await response.json(), link: response.headers.get("link") || "" };
          };
          const post = async (path, body) => {
            const response = await fetch(`${apiUrl}${path}`, { method: "POST", headers, body: JSON.stringify(body) });
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
          };
          const nextPage = (link) => {
            const next = link.split(",").map((part) => part.trim()).find((part) => /;\s*rel="next"$/.test(part));
            return next ? /^<([^>]+)>/.exec(next)?.[1] || "" : "";
          };
          const parseFromExactJob = async () => {
            let url = `${apiUrl}/repos/${repository}/actions/runs/${failedRunId}/jobs?per_page=100`;
            for (let pages = 0; url; pages += 1) {
              if (pages >= 10) throw new Error("Workflow job pagination exceeds the failed-run receipt bound");
              const { data, link } = await requestJson(url);
              for (const job of data.jobs || []) {
                const match = /^claude-review-pr-([1-9][0-9]*)-base-([0-9a-f]{40})-head-([0-9a-f]{40})$/.exec(job.name || "");
                if (match) return { prNumber: match[1], base: match[2], head: match[3], source: "job-name" };
              }
              url = nextPage(link);
            }
            return null;
          };
          const parseFromTitle = () => {
            const exact = /^Claude review PR #([1-9][0-9]*) @ ([0-9a-f]{40})$/.exec(displayTitle);
            if (exact) return { prNumber: exact[1], base: "", head: exact[2], source: "display-title" };
            const unresolved = /^Claude review PR #([1-9][0-9]*) @ resolve-head$/.exec(displayTitle);
            if (unresolved) return { prNumber: unresolved[1], base: "", head: "", source: "unresolved-title" };
            const malformedHead = /^Claude review PR #([1-9][0-9]*) @ .+$/.exec(displayTitle);
            if (malformedHead) return { prNumber: malformedHead[1], base: "", head: "", source: "malformed-title" };
            return null;
          };
          const runHasExactReviewJob = async (runId, prNumber, base, head) => {
            const exactJobName = `claude-review-pr-${prNumber}-base-${base}-head-${head}`;
            let url = `${apiUrl}/repos/${repository}/actions/runs/${runId}/jobs?per_page=100`;
            for (let pages = 0; url; pages += 1) {
              if (pages >= 10) throw new Error("Workflow job pagination exceeds the supersession scan bound");
              const { data, link } = await requestJson(url);
              if ((data.jobs || []).some((job) => job.name === exactJobName)) return true;
              url = nextPage(link);
            }
            return false;
          };
          const latestSameBaseHeadRunId = async (prNumber, base, head) => {
            let url = `${apiUrl}/repos/${repository}/actions/workflows/claude.yml/runs?per_page=100`;
            let latest = 0n;
            const baselineRunId = BigInt(failedRunId);
            const maxPages = 10;
            for (let pages = 0; url; pages += 1) {
              if (pages >= maxPages) throw new Error("Workflow run pagination exceeds the supersession scan bound");
              const { data, link } = await requestJson(url);
              for (const run of data.workflow_runs || []) {
                if (!/^\d+$/.test(String(run.id))) continue;
                const runId = BigInt(run.id);
                if (runId <= baselineRunId) return latest;
                const actor = run.actor?.login || "";
                const triggeringActor = run.triggering_actor?.login || "";
                const ownerTriggered = actor === "nikejshah" && triggeringActor === "nikejshah";
                if (ownerTriggered && await runHasExactReviewJob(run.id, prNumber, base, head)) {
                  if (runId > latest) latest = runId;
                }
              }
              url = nextPage(link);
            }
            return latest;
          };
          const runIdFromDetailsUrl = (value) => {
            const match = /\/actions\/runs\/([0-9]+)(?:\b|\/|$)/.exec(String(value || ""));
            return match ? BigInt(match[1]) : 0n;
          };
          const runIsOwnerTriggeredExactReview = async (runId, prNumber, base, head) => {
            const { data } = await requestJson(`${apiUrl}/repos/${repository}/actions/runs/${runId.toString()}`);
            const ownerTriggered = data?.actor?.login === "nikejshah" && data?.triggering_actor?.login === "nikejshah";
            return ownerTriggered && await runHasExactReviewJob(runId.toString(), prNumber, base, head);
          };
          const newerExactPassStatusRunId = async (prNumber, base, head) => {
            const expectedDescription = `PASS base ${base} head ${head}`;
            let newest = 0n;
            let url = `${apiUrl}/repos/${repository}/commits/${head}/statuses?per_page=100`;
            for (let pages = 0; url; pages += 1) {
              if (pages >= 10) throw new Error("Commit status pagination exceeds the failed-run receipt bound");
              const { data, link } = await requestJson(url);
              if (!Array.isArray(data)) throw new Error("Commit status response is malformed");
              for (const status of data) {
                if (status.context !== "factory-os/claude-review" || status.state !== "success" || status.description !== expectedDescription) continue;
                const runId = runIdFromDetailsUrl(status.target_url);
                if (runId > BigInt(failedRunId) && runId > newest && await runIsOwnerTriggeredExactReview(runId, prNumber, base, head)) newest = runId;
              }
              url = nextPage(link);
            }
            if (newest === 0n) return 0n;
            const latestRunId = await latestSameBaseHeadRunId(prNumber, base, head);
            return latestRunId === newest ? newest : 0n;
          };
          const currentPrRefs = async (prNumber) => {
            const { data } = await requestJson(`${apiUrl}/repos/${repository}/pulls/${prNumber}`);
            return { base: data?.base?.sha || "", head: data?.head?.sha || "" };
          };
          const receiptMarker = `<!-- claude-review-failed-run:${failedRunId} -->`;
          const receiptCommentAlreadyPublished = async (prNumber, base = "", head = "") => {
            let url = `${apiUrl}/repos/${repository}/issues/${prNumber}/comments?per_page=100`;
            for (let pages = 0; url; pages += 1) {
              if (pages >= 10) throw new Error("Issue comment pagination exceeds the failed-run receipt bound");
              const { data, link } = await requestJson(url);
              if (!Array.isArray(data)) throw new Error("Issue comment response is malformed");
              if (data.some((comment) => {
                if (comment?.user?.login !== "github-actions[bot]" || typeof comment.body !== "string") return false;
                if (comment.body.includes(receiptMarker) && comment.body.includes(`[Details](${detailsUrl})`)) return true;
                return Boolean(base && head &&
                  /Claude review (?:receipt|correction):/.test(comment.body) &&
                  comment.body.includes(`base \`${base}\``) &&
                  comment.body.includes(`head \`${head}\``) &&
                  comment.body.includes(`[Details](${detailsUrl})`));
              })) return true;
              url = nextPage(link);
            }
            return false;
          };
          const failureStatusAlreadyPublished = async (head) => {
            let url = `${apiUrl}/repos/${repository}/commits/${head}/statuses?per_page=100`;
            for (let pages = 0; url; pages += 1) {
              if (pages >= 10) throw new Error("Commit status pagination exceeds the failed-run receipt bound");
              const { data, link } = await requestJson(url);
              if (!Array.isArray(data)) throw new Error("Commit status response is malformed");
              if (data.some((status) =>
                status.context === "factory-os/claude-review" &&
                status.state === "failure" &&
                status.target_url === detailsUrl)) return true;
              url = nextPage(link);
            }
            return false;
          };

          (async () => {
            if (!allowedEvents.has(failedEvent)) {
              console.log(`Skipped failed-run receipt for unsupported event ${failedEvent}`);
              return;
            }
            if (runActor !== "nikejshah" || triggeringActor !== "nikejshah") {
              console.log(`Skipped failed-run receipt for non-owner actor ${runActor || "unknown"}`);
              return;
            }
            if (!/^\d+$/.test(failedRunId)) throw new Error("failed workflow run id is malformed");
            const resolved = await parseFromExactJob() || parseFromTitle();
            if (!resolved?.prNumber) {
              console.log(`Skipped failed-run receipt because the PR number could not be resolved from ${displayTitle}`);
              return;
            }

            if (!resolved.head || !resolved.base) {
              if (!(await receiptCommentAlreadyPublished(resolved.prNumber))) {
                await post(`/repos/${repository}/issues/${resolved.prNumber}/comments`, {
                  body: `${receiptMarker}\nClaude review receipt: **FAIL**. The ${failedEvent} workflow ended with ${failedConclusion} before resolving an exact PR base and head, so no commit status was written. [Details](${detailsUrl})`,
                });
              }
              return;
            }

            const commentAlreadyPublished = await receiptCommentAlreadyPublished(resolved.prNumber, resolved.base, resolved.head);
            const statusAlreadyPublished = await failureStatusAlreadyPublished(resolved.head);

            const live = await currentPrRefs(resolved.prNumber);
            let supersededReason = "";
            if (live.head !== resolved.head) {
              supersededReason = `the PR head is now ${live.head || "unknown"}`;
            } else if (live.base !== resolved.base) {
              supersededReason = `the PR base is now ${live.base || "unknown"}`;
            }
            try {
              const latestRunId = await latestSameBaseHeadRunId(resolved.prNumber, resolved.base, resolved.head);
              if (!supersededReason && latestRunId > BigInt(failedRunId)) {
                supersededReason = `a newer same-base/head review run ${latestRunId.toString()} exists`;
              }
            } catch (error) {
              console.log(`Continuing failed-run publication after newer-run scan failure: ${error.message}`);
            }

            if (!supersededReason) {
              try {
                const newerPassRunId = await newerExactPassStatusRunId(resolved.prNumber, resolved.base, resolved.head);
                if (newerPassRunId > 0n) supersededReason = `a newer same-base/head PASS status from review run ${newerPassRunId.toString()} exists`;
              } catch (error) {
                console.log(`Continuing failed-run publication after newer-PASS status scan failure: ${error.message}`);
              }
            }
            const body = supersededReason
              ? `${receiptMarker}\nClaude review receipt: **FAIL** for base \`${resolved.base}\` and head \`${resolved.head}\`. The ${failedEvent} workflow ended with ${failedConclusion}, but this result is superseded because ${supersededReason}; no commit status was written. [Details](${detailsUrl})`
              : `${receiptMarker}\nClaude review receipt: **FAIL** for base \`${resolved.base}\` and head \`${resolved.head}\`. The ${failedEvent} workflow ended with ${failedConclusion} before a terminal receipt was published. [Details](${detailsUrl})`;
            if (!commentAlreadyPublished) {
              await post(`/repos/${repository}/issues/${resolved.prNumber}/comments`, { body });
            }
            if (!supersededReason && !statusAlreadyPublished) {
              await post(`/repos/${repository}/statuses/${resolved.head}`, {
                state: "failure",
                context: "factory-os/claude-review",
                description: "Claude review workflow failed or was cancelled",
                target_url: detailsUrl,
              });
              try {
                const newerPassRunId = await newerExactPassStatusRunId(resolved.prNumber, resolved.base, resolved.head);
                if (newerPassRunId > 0n) {
                  await post(`/repos/${repository}/statuses/${resolved.head}`, {
                    state: "success",
                    context: "factory-os/claude-review",
                    description: `PASS base ${resolved.base} head ${resolved.head}`,
                    target_url: `${process.env.GITHUB_SERVER_URL || "https://github.com"}/${repository}/actions/runs/${newerPassRunId.toString()}`,
                  });
                }
              } catch (error) {
                console.log(`Post-failure newer-PASS restoration check failed: ${error.message}`);
              }
            }
          })().catch((error) => {
            console.error(`Failed to publish Claude failed-run receipt: ${error.message}`);
            process.exitCode = 1;
          });
          NODE
